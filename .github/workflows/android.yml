name: Android verification

on:
  push:
    branches: [codex/veil-mvp, codex/veil-v2]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/inference-requirements.txt
      - name: Install desktop model verification runtime
        run: python -m pip install -r ml/inference-requirements.txt
      - name: Verify ML tooling and bundled model metadata
        working-directory: ml
        run: python -m unittest discover -s tests -v
      - name: Exercise bundled model with synthetic image fixtures
        run: python ml/evaluate_bundled_model.py --output work/ci-model-smoke.json
      - name: Preserve model smoke report
        id: model_report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model-smoke-report
          path: work/ci-model-smoke.json
          if-no-files-found: warn
      - name: Preserve model evidence in unpublished private draft
        if: always() && steps.model_report.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/preserve_ci_delivery.py model

  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check source whitespace
        run: python3 tools/verify_source_format.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore private development signing key
        env:
          VEIL_DEBUG_KEYSTORE_B64: ${{ secrets.VEIL_V2_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$VEIL_DEBUG_KEYSTORE_B64" ]; then
            echo 'Trusted preview signing key is not configured.' >&2
            exit 1
          fi
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "veil-v2-development.p12").write_bytes(base64.b64decode(os.environ["VEIL_DEBUG_KEYSTORE_B64"], validate=True))'
          echo "VEIL_DEBUG_KEYSTORE=$RUNNER_TEMP/veil-v2-development.p12" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install Android SDK dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Verify unit tests, lint, debug and unsigned release packaging
        run: bash gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease :capture-fixture:assembleDebug
      - name: Check merged manifest privacy properties
        run: python3 tools/verify_manifest.py
      - name: Preserve verification reports
        id: verify_reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/intermediates/merged_manifests/debug/
          if-no-files-found: warn
      - name: Preserve installable debug APK
        id: debug_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: veil-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Preserve unsigned release APK
        id: release_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: veil-unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Preserve APKs and verification evidence in unpublished private draft
        if: always() && (steps.verify_reports.outcome == 'failure' || steps.debug_apk.outcome == 'failure' || steps.release_apk.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/preserve_ci_delivery.py verify

  emulator:
    permissions:
      contents: write
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore private development signing key
        env:
          VEIL_DEBUG_KEYSTORE_B64: ${{ secrets.VEIL_V2_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$VEIL_DEBUG_KEYSTORE_B64" ]; then
            echo 'Trusted preview signing key is not configured.' >&2
            exit 1
          fi
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "veil-v2-development.p12").write_bytes(base64.b64decode(os.environ["VEIL_DEBUG_KEYSTORE_B64"], validate=True))'
          echo "VEIL_DEBUG_KEYSTORE=$RUNNER_TEMP/veil-v2-development.p12" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        run: |
          # Use only licenses already present on the hosted runner. Do not accept agreements.
          export ANDROID_USER_HOME="$RUNNER_TEMP/veil-android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'system-images;android-35;default;x86_64' emulator
          echo no | avdmanager create avd --force --name veil-api35 --path "$ANDROID_AVD_HOME/veil-api35.avd" --package 'system-images;android-35;default;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/veil-api35.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd veil-api35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            adb pull /sdcard/Download/veil-capture-evidence capture-evidence || true
            kill "$emulator_pid" || true
          }
          trap cleanup EXIT
          if ! timeout 180 adb wait-for-device; then cat emulator.log; exit 1; fi
          booted=false
          for attempt in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [ "$booted" != true ]; then cat emulator.log; exit 1; fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          bash gradlew --no-daemon :capture-fixture:assembleDebug
          adb install -r capture-fixture/build/outputs/apk/debug/capture-fixture-debug.apk
          bash gradlew --no-daemon --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.veil.app.VeilVerificationSuite
          # UTP uninstalls its target after successful tests. Reinstall solely for preview.
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n com.veil.app.v2/com.veil.app.MainActivity
          sleep 3
          adb exec-out screencap -p > veil-emulator.png
      - name: Preserve device test reports
        id: emulator_reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            veil-emulator.png
            capture-evidence/
          if-no-files-found: warn
      - name: Preserve emulator evidence in unpublished private draft
        if: always() && steps.emulator_reports.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/preserve_ci_delivery.py emulator
