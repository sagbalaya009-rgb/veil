name: Android verification

on:
  push:
    branches: [codex/veil-mvp]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/inference-requirements.txt
      - name: Install desktop model verification runtime
        run: python -m pip install -r ml/inference-requirements.txt
      - name: Verify ML tooling and bundled model metadata
        working-directory: ml
        run: python -m unittest discover -s tests -v
      - name: Exercise bundled model with synthetic image fixtures
        run: python ml/evaluate_bundled_model.py --output work/ci-model-smoke.json
      - name: Preserve model smoke report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model-smoke-report
          path: work/ci-model-smoke.json
          if-no-files-found: warn
      - name: Preserve model evidence in unpublished private draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/preserve_ci_delivery.py model

  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check source whitespace
        run: python3 tools/verify_source_format.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install Android SDK dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Verify unit tests, lint, debug and unsigned release packaging
        run: bash gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Check merged manifest privacy properties
        run: python3 tools/verify_manifest.py
      - name: Preserve verification reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/intermediates/merged_manifests/debug/
          if-no-files-found: warn
      - name: Preserve installable debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: veil-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Preserve unsigned release APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: veil-unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Preserve APKs and verification evidence in unpublished private draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/preserve_ci_delivery.py verify

  emulator:
    permissions:
      contents: write
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        run: |
          # Use only licenses already present on the hosted runner. Do not accept agreements.
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'system-images;android-35;default;x86_64' emulator
          echo no | avdmanager create avd --force --name veil-api35 --package 'system-images;android-35;default;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd veil-api35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          timeout 180 adb wait-for-device
          booted=false
          for attempt in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [ "$booted" != true ]; then cat emulator.log; exit 1; fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          bash gradlew --no-daemon --stacktrace connectedDebugAndroidTest
          adb shell am start -W -n com.veil.app/.MainActivity
          sleep 3
          adb exec-out screencap -p > veil-emulator.png
      - name: Preserve device test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            veil-emulator.png
          if-no-files-found: warn
      - name: Preserve emulator evidence in unpublished private draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/preserve_ci_delivery.py emulator
