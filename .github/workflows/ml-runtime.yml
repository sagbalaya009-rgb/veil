name: V2 ML conversion engineering check
on:
  push:
    branches: [codex/veil-v2-ml-check, codex/veil-v2]
permissions:
  contents: read
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install isolated training-tool runtime
        run: python -m pip install -r ml/requirements.txt
      - name: Exercise RGB normalization and mathematical conversion parity
        env:
          TF_NUM_INTEROP_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '2'
        run: |
          mkdir -p work
          python ml/evaluation/verify_export_runtime.py > work/conversion-engineering.json
      - name: Preserve engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-conversion-engineering
          path: work/conversion-engineering.json
          if-no-files-found: warn

